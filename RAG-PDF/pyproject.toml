[project]
name = "ai-apps"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rahi", email = "rahirahmani2008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "inngest>=0.5.19",
    "llama-index-core>=0.14.25",
    "llama-index-readers-file>=0.7.0",
    "openai>=3.29.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.19.1",
    "streamlit>=1.65.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-apps = "ai_apps:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
